[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"
[project]
name = "data-qd-155"
version = "0.1.0"
description = "Deterministic FIFO discrete-event service queue analysis"
requires-python = ">=3.11"
dependencies = []
[project.scripts]
queue-replay = "queue_replay.cli:main"
queue-planner = "queue_planner.cli:main"
queue-observe = "queue_observe.cli:main"
queue-cost = "queue_cost.cli:main"
queue-reconcile = "queue_reconcile.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
